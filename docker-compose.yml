name: tourism-site

services:
  mysql:
    image: mysql:8.0
    container_name: tourism-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    ports:
      # 避开本机可能占用的 3306
      - "33061:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: tourism-backend:latest
    container_name: tourism-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: tourism
      DB_USER: root
      DB_PASS: root123456
      TZ: Asia/Shanghai
      # DeepSeek API Key：从宿主机 .env（gitignore）注入，key 不进仓库
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 高德开放平台：Web 服务 key + Web端 JS key + 安全密钥
      AMAP_KEY: ${AMAP_KEY:-}
      AMAP_JS_KEY: ${AMAP_JS_KEY:-}
      AMAP_SECURITY_CODE: ${AMAP_SECURITY_CODE:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: tourism-frontend:latest
    container_name: tourism-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
