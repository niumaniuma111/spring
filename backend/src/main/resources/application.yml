server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:tourism}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:tourism}
    password: ${DB_PASS:tourism123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  # HS256 需要至少 32 字节密钥
  secret: TourismSiteJwtSecretKey-2026-Neusoft-Practice-0123456789
  expire-hours: 72

deepseek:
  # API Key 必须通过环境变量注入（.env / 启动脚本），禁止写死进代码
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  connect-timeout-seconds: 10
  read-timeout-seconds: 120

amap:
  # 高德开放平台 key：Web 服务 key（后端）+ Web端 JS key（前端地图），均环境变量注入
  key: ${AMAP_KEY:}
  js-key: ${AMAP_JS_KEY:}
  security-code: ${AMAP_SECURITY_CODE:}
  timeout-seconds: 10
